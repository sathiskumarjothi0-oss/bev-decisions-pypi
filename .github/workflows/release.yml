# Publishes to PyPI when a GitHub release is published (tag vX.Y.Z), using PyPI trusted publishing: no token is stored.
# One-time setup on pypi.org: project bev-decisions -> Publishing -> add a trusted publisher for this repository,
# workflow "release.yml", environment "pypi".
name: Release
on:
  release: {types: [published]}
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
